<title>Structura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: translucent sticky bar on top; inset-grouped topic list left; one rounded workspace right (segmented Learn / Visualize / Code / Quiz, or the Grok chat). Stacks on phones. Single balanced-light look, iOS-style motion. */
:root{
  --bg:#F2F3F7; --surface:#FFFFFF; --surface2:#F0F1F6; --fill:#E6E8EF; --fg:#1B1C21; --muted:#6B6E7A; --line:#E3E5EC;
  --accent:#0A6CF0; --accent-soft:#E6F0FF; --accent-fg:#FFFFFF;
  --hi:#D98200; --hi-soft:#FFF0D3; --ok:#23975A; --ok-soft:#DFF4E8; --bad:#D93A30; --bad-soft:#FDE6E4;
  --code-bg:#F6F7FB; --code-fg:#232733; --code-k:#0A6CF0; --code-c:#8A8F9E; --code-s:#1F8A55;
  --shadow:0 1px 2px rgba(25,30,50,.04),0 6px 20px rgba(25,30,50,.06);
  --shadow-lg:0 2px 6px rgba(25,30,50,.05),0 18px 44px rgba(25,30,50,.12);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --r-lg:26px; --r-md:18px; --r-sm:12px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--font);-webkit-font-smoothing:antialiased;padding-block:0 64px}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:16px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
html[data-grok]:not([data-grok="ready"]) .grok-only{display:none!important}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(242,243,247,.74);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-bottom:1px solid rgba(25,30,50,.06);animation:drop .7s var(--ease) both}
.barin{display:flex;align-items:center;gap:18px 32px;padding-block:12px}
.brand{display:flex;align-items:center;gap:12px;flex:none}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#4C9BFF,#0A6CF0);display:grid;place-items:center;box-shadow:0 6px 16px rgba(10,108,240,.28)}
.brand h1{margin:0;font:700 20px/1.1 var(--font);letter-spacing:-.02em}
.brand p{margin:2px 0 0;font:500 12px/1.2 var(--font);color:var(--muted)}
.ask{display:flex;align-items:center;gap:8px;flex:1;min-width:0;background:var(--fill);border-radius:999px;padding:5px 5px 5px 14px;transition:box-shadow .35s var(--ease),background .35s var(--ease)}
.ask:focus-within{background:var(--surface);box-shadow:0 0 0 3px rgba(10,108,240,.22),var(--shadow)}
.ask svg{flex:none;color:var(--muted)}
.ask input{flex:1;min-width:0;border:0;background:none;outline:none;padding:7px 2px}
.ask input::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:14px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--surface);border:0;color:var(--fg);padding:7px 14px;border-radius:999px;font-size:13px;cursor:pointer;box-shadow:var(--shadow);transition:transform .35s var(--spring),color .2s}
.chip:active{transform:scale(.94)}
@media (hover:hover){.chip:hover{color:var(--accent)}}
.chip:disabled{opacity:.5;cursor:default}

/* buttons */
.btn{background:var(--fill);border:0;padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:550;transition:transform .35s var(--spring),background .25s,opacity .25s}
.btn:active:not(:disabled){transform:scale(.94)}
@media (hover:hover){.btn:hover:not(:disabled){background:#DCDFE8}.btn.pri:hover:not(:disabled){background:#0860D8}}
.btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:var(--accent);color:var(--accent-fg)}
.btn.sm{padding:6px 13px;font-size:13px}

/* shell */
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);gap:32px;align-items:start;padding-top:18px}
nav{display:flex;flex-direction:column;position:sticky;top:calc(84px + env(safe-area-inset-top,0px));background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:8px;gap:2px}
nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;background:none;border:0;border-radius:var(--r-sm);padding:10px 12px;text-align:left;cursor:pointer;font-weight:550;transition:background .3s var(--ease),color .3s var(--ease),transform .35s var(--spring);animation:rise .7s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
nav button small{font:500 11px var(--mono);color:var(--muted)}
nav button:active{transform:scale(.97)}
@media (hover:hover){nav button:hover{background:var(--surface2)}}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
nav button[aria-current="true"] small{color:var(--accent)}
.navchat{gap:10px!important;justify-content:flex-start!important}
.navchat .navtxt{flex:1}
.navglyph{width:26px;height:26px;border-radius:9px;background:linear-gradient(145deg,#8E7BFF,#5A5CF0);display:grid;place-items:center;color:#fff}
.navsep{height:1px;background:var(--line);margin:6px 10px}
main{min-width:0}
.enter{animation:enter .6s var(--ease) both}
.thead h2{margin:0;font:700 clamp(30px,5vw,44px)/1.05 var(--font);letter-spacing:-.035em}
.thead .tag{display:inline-block;margin-top:10px;padding:3px 10px;border-radius:999px;background:var(--accent-soft);font:600 11px var(--mono);color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.thead p{margin:10px 0 0;color:var(--muted);max-width:60ch}

/* segmented control */
.seg{position:relative;display:flex;max-width:460px;margin-block:22px 24px;padding:3px;background:var(--fill);border-radius:14px}
.seg button{position:relative;z-index:1;flex:1;background:none;border:0;padding:8px 10px;border-radius:11px;cursor:pointer;font-weight:550;color:var(--muted);transition:color .3s var(--ease)}
.seg button[aria-selected="true"]{color:var(--fg)}
.thumb{position:absolute;top:3px;bottom:3px;left:0;width:0;background:var(--surface);border-radius:11px;box-shadow:0 1px 3px rgba(25,30,50,.12),0 3px 10px rgba(25,30,50,.06);transition:transform .5s var(--ease),width .5s var(--ease)}
.thumb.noanim{transition:none}

/* answer sheet */
#answer{margin-top:4px}
.answer{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);padding:20px 22px;margin-bottom:26px;display:grid;gap:12px;transform-origin:top center;animation:sheet .6s var(--spring) both}
.answer.out{animation:sheetout .26s var(--ease) both}
.answer header{display:flex;justify-content:space-between;gap:12px;align-items:center}
.answer h3{margin:0;font:650 19px var(--font);letter-spacing:-.015em}
.answer p{margin:0;max-width:68ch}
.answer ul{margin:0;padding-left:20px;display:grid;gap:5px}
.answer .q{font:500 12px var(--mono);color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}

/* learn */
.learn{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:start}
.prose p{margin:0 0 14px;max-width:62ch}
.analogy{margin:18px 0 16px;padding:16px 18px;background:var(--accent-soft);border-radius:var(--r-md);max-width:62ch}
.analogy b{display:block;font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:4px}
.side{display:grid;gap:16px;min-width:0}
.card{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);padding:16px 18px;min-width:0;animation:rise .7s var(--ease) both;animation-delay:calc(var(--i,0)*70ms + 80ms)}
.card h3{margin:0 0 10px;font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.card ul{margin:0;padding-left:18px;display:grid;gap:6px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:4px 10px 8px 0;border-bottom:1px solid var(--line)}
td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.cx{font-family:var(--mono);font-size:13px;white-space:nowrap}
td.cx.c1{color:var(--ok)} td.cx.c2{color:var(--accent)} td.cx.c3{color:var(--hi)}

/* visualizer */
.vbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end;margin-bottom:14px}
.fld{display:grid;gap:4px;font:600 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fld input,.fld select{background:var(--surface);border:0;box-shadow:inset 0 0 0 1px var(--line);padding:8px 12px;border-radius:12px;font:400 14px var(--mono);color:var(--fg);text-transform:none;letter-spacing:0;width:110px;transition:box-shadow .3s var(--ease)}
.fld input:focus,.fld select:focus{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
.stage{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:22px;min-height:240px;overflow-x:auto;display:grid;place-items:center}
.vlog{margin:12px 2px 0;color:var(--muted);min-height:3.2em;max-width:72ch}
.vask{margin-top:4px}
.cell{min-width:48px;height:44px;padding-inline:8px;display:grid;place-items:center;border-radius:12px;background:var(--surface2);box-shadow:inset 0 0 0 1.5px var(--line);font:500 14px var(--mono);transition:background .3s var(--ease),box-shadow .3s var(--ease)}
.cell.hi{background:var(--hi-soft);box-shadow:inset 0 0 0 2px var(--hi);animation:pop .5s var(--spring)}
.cell.ok{background:var(--ok-soft);box-shadow:inset 0 0 0 2px var(--ok);animation:pop .5s var(--spring)}
.cap{font:600 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:center}
.empty{color:var(--muted);font:400 13px var(--mono);padding:14px}
.stackbox{display:grid;gap:8px;justify-items:center;width:140px}
.col{display:flex;flex-direction:column-reverse;gap:5px;width:100%}
.qrow,.arr,.chain{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.slot{display:grid;gap:5px;justify-items:center}
.slot small{font:400 11px var(--mono);color:var(--muted)}
.lrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 5px;justify-content:center}
.lnode{display:flex;border-radius:12px;background:var(--surface2);box-shadow:inset 0 0 0 1.5px var(--line);font:500 14px var(--mono);overflow:hidden;transition:background .3s var(--ease)}
.lnode span{padding:10px 13px}
.lnode i{display:block;width:28px;border-left:1.5px solid var(--line);position:relative}
.lnode i::after{content:"";position:absolute;inset:0;margin:auto;width:7px;height:7px;border-radius:50%;background:var(--muted)}
.lnode.hi{background:var(--hi-soft);box-shadow:inset 0 0 0 2px var(--hi);animation:pop .5s var(--spring)}
.lnode.ok{background:var(--ok-soft);box-shadow:inset 0 0 0 2px var(--ok);animation:pop .5s var(--spring)}
.arrow{color:var(--muted);font-family:var(--mono)}
.ltag{font:600 11px var(--mono);color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
svg.tree{max-width:100%;height:auto}
.edge{stroke:var(--line);stroke-width:2.5;stroke-linecap:round;transition:stroke .3s}
.edge.on{stroke:var(--accent)}
.node circle{fill:var(--surface2);stroke:var(--accent);stroke-width:2.5;transition:fill .3s var(--ease)}
.node text{fill:var(--fg);font:500 13px var(--mono);text-anchor:middle;dominant-baseline:central}
.node.hi circle{fill:var(--hi-soft);stroke:var(--hi);transform-box:fill-box;transform-origin:center;animation:pop .5s var(--spring)}
.node.ok circle{stroke:var(--ok);fill:var(--ok-soft)}
.node.vis circle{fill:var(--accent);stroke:var(--accent)}
.node.vis text{fill:var(--accent-fg)}
.node.fr circle{stroke:var(--hi);stroke-dasharray:4 3}
.node.cur circle{fill:var(--hi);stroke:var(--hi);transform-box:fill-box;transform-origin:center;animation:pop .5s var(--spring)}
.node.cur text{fill:#fff}
.below{display:grid;gap:14px;width:100%;justify-items:center}
.ord{font:400 13px var(--mono);color:var(--muted);min-height:1.5em;text-align:center}
.ord b{color:var(--fg);font-weight:500}
.buckets{display:grid;gap:4px;width:100%;max-width:560px}
.brow{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:center;min-height:40px;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow>b{font:500 12px var(--mono);color:var(--muted)}
.chain .cell{height:32px;min-width:44px;border-radius:10px}
.gwrap{display:grid;gap:12px;width:100%;justify-items:center}
.gpanels{display:flex;flex-wrap:wrap;gap:6px 28px;font:400 13px var(--mono);color:var(--muted);justify-content:center}
.gpanels b{color:var(--fg);font-weight:500}

/* code */
.codehead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.codehead span{font:600 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
pre.code{margin:0;background:var(--code-bg);color:var(--code-fg);padding:18px 20px;border-radius:var(--r-md);box-shadow:inset 0 0 0 1px var(--line);overflow-x:auto;font:400 13px/1.65 var(--mono);tab-size:4}
pre.code .k{color:var(--code-k)} pre.code .c{color:var(--code-c);font-style:italic} pre.code .s{color:var(--code-s)}

/* quiz */
.quiz{max-width:640px;display:grid;gap:16px}
.quiz h3{margin:0;font:650 22px/1.3 var(--font);letter-spacing:-.02em}
.quiz .meta{font:600 12px var(--mono);color:var(--muted)}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:0;box-shadow:var(--shadow);padding:13px 16px;border-radius:var(--r-md);cursor:pointer;margin-bottom:10px;transition:transform .35s var(--spring),box-shadow .3s var(--ease)}
.opt:active:not(:disabled){transform:scale(.98)}
@media (hover:hover){.opt:hover:not(:disabled){box-shadow:var(--shadow),inset 0 0 0 1.5px var(--accent)}}
.opt.right{background:var(--ok-soft);box-shadow:inset 0 0 0 2px var(--ok);animation:pop .5s var(--spring)}
.opt.wrong{background:var(--bad-soft);box-shadow:inset 0 0 0 2px var(--bad)}
.why{padding:14px 16px;background:var(--surface2);border-radius:var(--r-md);animation:rise .5s var(--ease) both}
.score{font:700 54px/1 var(--font);letter-spacing:-.03em}
.note{margin:0;color:var(--muted);font-size:14px}

/* chat */
.chat{display:grid;gap:14px}
.status{display:flex;align-items:center;gap:10px;padding:9px 16px;background:var(--surface);border-radius:999px;box-shadow:var(--shadow);font-size:13px;width:fit-content;max-width:100%}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ready{background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
.dot.nokey{background:var(--hi);box-shadow:0 0 0 4px var(--hi-soft)}
.setup{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);padding:18px 20px;display:grid;gap:10px;max-width:640px}
.setup h3{margin:0;font:650 17px var(--font)}
.setup ol{margin:0;padding-left:20px;display:grid;gap:6px}
.setup code{font:13px var(--mono);background:var(--surface2);padding:1px 6px;border-radius:6px}
.msgs{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px;min-height:340px;max-height:min(60vh,560px);overflow-y:auto;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
.msg{display:flex;animation:bubbleL .55s var(--spring) both;transform-origin:left bottom}
.msg.user{justify-content:flex-end;animation-name:bubbleR;transform-origin:right bottom}
.bubble{max-width:min(84%,640px);padding:10px 15px;border-radius:22px;line-height:1.5;overflow-wrap:anywhere;min-width:0}
.msg.bot .bubble{background:var(--surface2);border-bottom-left-radius:8px}
.msg.user .bubble{background:var(--accent);color:var(--accent-fg);border-bottom-right-radius:8px;white-space:pre-wrap}
.msg.err .bubble{background:var(--bad-soft);color:var(--bad)}
.bubble p{margin:0 0 8px}
.bubble p:last-child,.bubble ul:last-child,.bubble ol:last-child{margin-bottom:0}
.bubble ul,.bubble ol{margin:0 0 8px;padding-left:20px;display:grid;gap:3px}
.bubble code{font:13px var(--mono);background:rgba(25,30,50,.07);padding:1px 6px;border-radius:6px}
.bubble pre.code{margin:8px 0;padding:12px 14px;border-radius:14px;font-size:12.5px;background:var(--surface)}
.bubble pre.code:last-child{margin-bottom:0}
.typing{display:flex;gap:5px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bounce 1.2s var(--ease) infinite}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
.qchips{display:flex;gap:8px;overflow-x:auto;padding-block:2px 4px;scrollbar-width:none}
.qchips::-webkit-scrollbar{display:none}
.composer{display:flex;align-items:flex-end;gap:8px;background:var(--surface);border-radius:26px;box-shadow:var(--shadow);padding:6px 6px 6px 18px;transition:box-shadow .35s var(--ease)}
.composer:focus-within{box-shadow:0 0 0 3px rgba(10,108,240,.22),var(--shadow)}
.composer textarea{flex:1;min-width:0;border:0;background:none;resize:none;outline:none;padding:9px 0;max-height:130px;line-height:1.45}
.composer textarea:disabled{cursor:not-allowed}
.sendbtn{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .35s var(--spring),opacity .25s,background .25s}
.sendbtn:active:not(:disabled){transform:scale(.88)}
.sendbtn:disabled{opacity:.35;cursor:default}
.sendbtn.stop{background:var(--fg)}

@keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@keyframes sheet{from{opacity:0;transform:translateY(-14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes sheetout{to{opacity:0;transform:translateY(-10px) scale(.97)}}
@keyframes pop{from{transform:scale(.86)}to{transform:scale(1)}}
@keyframes bubbleL{from{opacity:0;transform:translateY(10px) scale(.82)}to{opacity:1;transform:none}}
@keyframes bubbleR{from{opacity:0;transform:translateY(10px) scale(.82)}to{opacity:1;transform:none}}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}

@media (max-width:900px){.learn{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .barin{flex-wrap:wrap;gap:10px}
  .brand{width:100%}
  .brand p{display:none}
  .shell{grid-template-columns:minmax(0,1fr);gap:16px}
  nav{flex-direction:row;overflow-x:auto;position:static;padding:6px;scrollbar-width:none;border-radius:999px}
  nav::-webkit-scrollbar{display:none}
  nav button{white-space:nowrap;border-radius:999px;flex:none}
  nav button small,.navsep{display:none}
  .seg{max-width:none}
  .msgs{padding:14px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
  html{scroll-behavior:auto}
}
</style>

<header class="bar">
  <div class="wrap barin">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.2" fill="#fff"/><circle cx="6" cy="18" r="2.2" fill="#fff"/><circle cx="18" cy="18" r="2.2" fill="#fff"/><path d="M12 7.2 6.8 15.9M12 7.2l5.2 8.7"/></svg></span>
      <div><h1>Structura</h1><p>Data structures tutor</p></div>
    </div>
    <form class="ask" id="askform" autocomplete="off">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="text" aria-label="Ask a question" placeholder="Ask anything, e.g. heap vs bst">
      <button class="btn pri sm" type="submit">Ask</button>
    </form>
  </div>
</header>
<div class="wrap">
  <div class="chips" id="chips"></div>
  <div class="shell">
    <nav id="nav" aria-label="Topics"></nav>
    <main>
      <section id="answer" hidden></section>
      <div id="topic"></div>
    </main>
  </div>
</div>

<script>
(function(){
'use strict';

    def _insert(self, node, key):

    def __init__(self):
        self.a = []

    def push(self, x):                 # O(log n)
        a = self.a
        a.append(x)
        i = len(a) - 1
        while i > 0 and a[(i - 1) // 2] > a[i]:
            p = (i - 1) // 2
            a[i], a[p] = a[p], a[i]    # bubble up
            i = p

    def pop(self):                     # O(log n)
        a = self.a
        top, last = a[0], a.pop()
        if a:
            a[0] = last
            i = 0
            while True:                # sift down
                l, r, m = 2*i + 1, 2*i + 2, i
                if l < len(a) and a[l] < a[m]: m = l
                if r < len(a) and a[r] < a[m]: m = r

  code:`class HashTable:
    def __init__(self, buckets=7):
        self.m = buckets
        self.table = [[] for _ in range(self.m)]
        self.n = 0

    def _h(self, key):
        return sum(ord(c) for c in key) % self.m

    def put(self, key, val):           # O(1) average
        chain = self.table[self._h(key)]
        for pair in chain:
            if pair[0] == key:
                pair[1] = val
                return
        chain.append([key, val])
        self.n += 1
        if self.n / self.m > 0.75:     # load factor too high
            self._resize(self.m * 2)

    def get(self, key):
        for k, v in self.table[self._h(key)]:
            if k == key:
                return v
        raise KeyError(key)

    def _resize(self, m):
        old = [p for chain in self.table for p in chain]
        self.m, self.table, self.n = m, [[] for _ in range(m)], 0

def bfs(start):                        # queue, level by level
    seen, order, q = {start}, [], deque([start])
    while q:
        cur = q.popleft()
        order.append(cur)
        for nb in graph[cur]:

                q.append(nb)

  [/priority|top.?k|smallest|largest|minimum|maximum|kth|schedul|median|urgent|most important/, 'heap', 'you keep asking for the smallest or largest item next'],
  [/network|route|shortest|path|friend|social|map|dependenc|connect|maze|relationship|web page|link/, 'graph', 'the data is things and the relationships between them'],
  [/random access|fixed size|matrix|grid|read by (index|position)|fast read|index/, 'array', 'you read items by position and the size is mostly stable'],
  [/insert.*(front|middle|often)|frequent insert|splice|many insertions|no random access/, 'linked-list', 'you insert and delete often and rarely read by position']

function num(input, def){ var n = parseInt(input.value,10); return isNaN(n) ? def : n; }

function shell(host){
  var bar = el('div',{class:'vbar'}), stage = el('div',{class:'stage'}), log = el('p',{class:'vlog','aria-live':'polite'});

        var e = epoch, args = arguments;
        try { await fn.apply(null, args); } catch(err){ if (err !== ABORT) console.error(err); }

function vizBST(host){
  var ui = shell(host), root = null, count = 0;
  var v = field('bv','Key','45','number',80);
  function ins(k){
    var n = {v:k,l:null,r:null}, path = [];
    if (!root){ root = n; count++; return {path:path, added:true}; }
    var c = root;
    while (true){
      path.push(c.v);
      if (k === c.v) return {path:path, added:false};
      if (k < c.v){ if (!c.l){ c.l = n; break; } c = c.l; }
      else { if (!c.r){ c.r = n; break; } c = c.r; }

    (function go(n,d){ if (!n) return; go(n.l,d+1); pos.set(n,{x:i++,y:d}); go(n.r,d+1); })(root,0);
    return pos;
  }

        svg.append(sv('line',{class:'edge'+((hi.indexOf(n.v)>-1&&hi.indexOf(c.v)>-1)?' on':''),x1:30+p.x*40,y1:26+p.y*54,x2:30+q.x*40,y2:26+q.y*54}));
      });
    });
    pos.forEach(function(p,n){
      svg.append(sv('g',{class:'node'+(hi.indexOf(n.v)>-1?' hi':'')+(ok.indexOf(n.v)>-1?' ok':'')}, sv('circle',{cx:30+p.x*40,cy:26+p.y*54,r:17}), sv('text',{x:30+p.x*40,y:26+p.y*54},n.v)));
    });
    ui.stage.replaceChildren(el('div',{class:'below'}, svg, el('div',{class:'ord',id:'ord'})));
  }
  function ord(label, list){ var o = $('#ord'); if (o) o.replaceChildren(el('b',{text:label+': '}), list.join(', ')); }
  var insert = ui.lock(async function(){
    var k = num(v.input,45);

    var r = ins(k), shown = [];

    draw(shown.concat([k])); await wait(60);
    ui.say('insert('+k+'): compared with '+plural(r.path.length,'node')+' on the way down ('+r.path.join(' → ')+'), then attached as a new leaf. Height is now '+height(root)+'.');
  });
  var search = ui.lock(async function(){
    var k = num(v.input,45), c = root, path = [];
    while (c){
      path.push(c.v); draw(path.slice());
      ui.say('Compare '+k+' with '+c.v+(k===c.v?': match.':(k<c.v?': smaller, go left.':': larger, go right.'))); await wait(450);
      if (k === c.v){ draw(path.slice(0,-1),[k]); return ui.say('Found '+k+' after '+plural(path.length,'comparison')+'. A tree of height '+height(root)+' needs at most '+height(root)+'.'); }
      c = k < c.v ? c.l : c.r;

        if (kind==='in') out.push(n.v);
        go(n.r);
        if (kind==='post') out.push(n.v);

function mdText(s){
  var html = [];
  function il(t){ return esc(t).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>'); }
  s.split(/\n{2,}/).forEach(function(b){
    b = b.replace(/^\n+|\n+$/g,''); if (!b) return;
    var lines = b.split('\n');
    var isUl = lines.every(function(l){ return /^\s*[-*]\s+/.test(l); });
    var isOl = lines.every(function(l){ return /^\s*\d+[.)]\s+/.test(l); });
    if (isUl) html.push('<ul>'+lines.map(function(l){ return '<li>'+il(l.replace(/^\s*[-*]\s+/,''))+'</li>'; }).join('')+'</ul>');
    else if (isOl) html.push('<ol>'+lines.map(function(l){ return '<li>'+il(l.replace(/^\s*\d+[.)]\s+/,''))+'</li>'; }).join('')+'</ol>');
    else if (/^#{1,4}\s/.test(b)) html.push('<p><b>'+il(b.replace(/^#{1,4}\s+/,''))+'</b></p>');
    else html.push('<p>'+lines.map(il).join('<br>')+'</p>');
  });
  return html.join('');
}

  cand.forEach(function(c){
    var re = new RegExp('(^|[^a-z0-9])'+c.w.replace(/[-\/\\^$*+?.()|[\]{}]/g,'\\$&')+'([^a-z0-9]|$)');
    if (re.test(rest)){
      if (!hits[c.id]){ hits[c.id] = true; order.push(c.id); }
      rest = rest.replace(re, '  ');
    }
  });
  return order;
}

function answer(raw){
  var q = norm(raw), ids = findTopics(q), body, title;
  var wantCx = /complex|big.?o|o\(|time|space|fast|slow|efficien|cost|how long/.test(q);
  var wantCode = /code|implement|python|write|program|build|snippet|example/.test(q);
  var wantWatch = /mistake|pitfall|bug|wrong|careful|gotcha|problem|downside|drawback|disadvantage/.test(q);
  var wantUse = /when|use case|used for|where|should i|why use|advantage|benefit/.test(q);
  var wantViz = /visuali|show me|animate|demo|see how|simulate/.test(q);
  var scen = SCENARIOS.filter(function(s){ return s[0].test(q); });
  var ask = /(i need|i want|i have|which|what should|what.*best|best.*(for|to)|recommend|suggest|what data structure|use for)/.test(q);

  if ((ask || !ids.length) && scen.length && !(ids.length > 1)){
    var pick = scen.slice(0,2);
    title = 'Suggested: ' + pick.map(function(s){ return BY[s[1]].name; }).join(' or ');
    body = el('div',{class:'cmp'}, pick.map(function(s){
      var t = BY[s[1]];
      return el('div',{style:'display:grid;gap:10px;align-content:start'}, para(t.name+' fits because '+s[2]+'.'), para(t.tagline), openBtns([s[1]]));
    }));
    return showAnswer(raw, title, body);
  }
  if (!ids.length){
    return showAnswer(raw, 'I can help with these topics', el('div',{style:'display:grid;gap:12px'},
      para('I did not match that to a topic. I cover arrays, linked lists, stacks, queues, binary search trees, heaps, hash tables and graphs. Try "what is the time complexity of a heap insert", "stack vs queue", "implement a hash table", or describe a job you need done, such as "I need to undo actions".'),
      openBtns(TOPICS.map(function(t){ return t.id; }).slice(0,4)), openBtns(TOPICS.map(function(t){ return t.id; }).slice(4))));
  }
  if (ids.length === 1 && ids[0] === 'graph' && /bfs.*dfs|dfs.*bfs|breadth.*depth|depth.*breadth/.test(q)){
    return showAnswer(raw, 'BFS vs DFS', el('div',{style:'display:grid;gap:12px'}, para(BFSDFS), openBtns(['graph'],'viz')));
  }
  if (ids.length >= 2){
    var two = ids.slice(0,2), key = two.slice().sort().join('|'), A = BY[two[0]], B = BY[two[1]];
    title = A.name + ' vs ' + B.name;
    body = el('div',{style:'display:grid;gap:14px'},
      para(COMPARE[key] || (A.name+': '+A.tagline+' '+B.name+': '+B.tagline)),
      el('div',{class:'cmp'}, [A,B].map(function(t){ return el('div',{}, el('h3',{text:t.name,style:'margin:0 0 6px;font:600 15px var(--font)'}), cxTable(t.cx.slice(0,4))); })),
      openBtns(two));
    return showAnswer(raw, title, body);
  }
  var t = BY[ids[0]], parts = [];
  if (wantCode){
    title = t.name + ': Python code';
    parts.push(para('Here is a compact implementation. The comments mark the cost of each operation.'), renderCode(t), openBtns([t.id]));
  } else if (wantWatch){
    title = t.name + ': common pitfalls';
    parts.push(el('ul',{}, t.watch.map(function(w){ return el('li',{text:w}); })), openBtns([t.id]));
  } else if (wantCx){
    var rows = t.cx, note = '';
    var ops = [[/insert|add|push|enqueue|append/,/insert|add|push|enqueue|append/],[/delete|remove|pop|dequeue|extract/,/delete|remove|pop|dequeue|extract/],[/search|find|lookup|look up|get|access|peek|contains/,/search|find|lookup|access|peek|check/],[/space|memory/,/space/],[/traver|bfs|dfs/,/traver|bfs/]];
    for (var i = 0; i < ops.length; i++){
      if (ops[i][0].test(q)){
        var f = t.cx.filter(function(r){ return ops[i][1].test(r[0].toLowerCase()); });
        if (f.length){ rows = f; note = 'Showing the rows that match your question. '; }
        break;
      }
    }
    title = t.name + ': complexity';
    parts.push(para(note+'Average and worst case differ when the structure can degrade, for example an unbalanced tree or a table full of collisions.'), cxTable(rows), openBtns([t.id]));
  } else if (wantUse){
    title = 'When to use a ' + t.name.toLowerCase();
    parts.push(el('ul',{}, t.use.map(function(w){ return el('li',{text:w}); })), para('Watch out: '+t.watch[0]+'.'), openBtns([t.id]));
  } else {
    title = t.name;
    parts.push(para(t.explain[0]), para('Think of it as: '+t.analogy.charAt(0).toLowerCase()+t.analogy.slice(1)), cxTable(t.cx.slice(0,4)), openBtns([t.id]), el('div',{class:'row'}, btn('Try the visualizer', function(){ go(t.id,'viz'); }, 'sm'), btn('Take the quiz', function(){ go(t.id,'quiz'); }, 'sm')));
  }
  if (wantViz) parts.push(openBtns([t.id],'viz'));
  showAnswer(raw, title, el('div',{style:'display:grid;gap:12px'}, parts));
}
